<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Readers-Writers (Semaphore) Simulation</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        h1 { text-align: center; color: #38bdf8; }
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        button { padding: 8px 16px; background: #38bdf8; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: #0f172a; }
        button:hover { background: #0284c7; }
        .card { background: #1e293b; border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        .resource-box { font-size: 1.2rem; color: #a7f3d0; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #334155; padding: 8px; text-align: left; font-size: 0.9rem; }
        th { background: #334155; }
        .active { background: #1e3a8a; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Readers-Writers Execution Simulation</h1>
    <div class="controls">
        <button onclick="play()">Play</button>
        <button onclick="pause()">Pause</button>
        <button onclick="reset()">Reset</button>
    </div>
    <div class="card resource-box">
        <strong>Current Shared Resource:</strong> <span id="resVal">-</span>
    </div>
    <div class="card">
        <h3>Execution Timeline</h3>
        <table>
            <thead>
                <tr><th>Time (s)</th><th>Entity</th><th>ID</th><th>Action</th><th>Resource State</th></tr>
            </thead>
            <tbody id="logBody"></tbody>
        </table>
    </div>

    <script>
        const events = [{"time": 0.25, "type": "Reader", "id": 1, "action": "Waiting to read", "resource": "Initial Value"}, {"time": 0.27, "type": "Reader", "id": 1, "action": "Reading resource", "resource": "Initial Value"}, {"time": 0.28, "type": "Reader", "id": 3, "action": "Waiting to read", "resource": "Initial Value"}, {"time": 0.28, "type": "Reader", "id": 3, "action": "Reading resource", "resource": "Initial Value"}, {"time": 0.28, "type": "Reader", "id": 4, "action": "Waiting to read", "resource": "Initial Value"}, {"time": 0.28, "type": "Reader", "id": 4, "action": "Reading resource", "resource": "Initial Value"}, {"time": 0.34, "type": "Reader", "id": 2, "action": "Waiting to read", "resource": "Initial Value"}, {"time": 0.34, "type": "Reader", "id": 2, "action": "Reading resource", "resource": "Initial Value"}, {"time": 0.42, "type": "Writer", "id": 2, "action": "Waiting to write", "resource": "Initial Value"}, {"time": 0.44, "type": "Reader", "id": 3, "action": "Finished reading", "resource": "Initial Value"}, {"time": 0.49, "type": "Writer", "id": 1, "action": "Waiting to write", "resource": "Initial Value"}, {"time": 0.51, "type": "Reader", "id": 1, "action": "Finished reading", "resource": "Initial Value"}, {"time": 0.53, "type": "Reader", "id": 4, "action": "Finished reading", "resource": "Initial Value"}, {"time": 0.59, "type": "Reader", "id": 2, "action": "Finished reading", "resource": "Initial Value"}, {"time": 0.59, "type": "Writer", "id": 2, "action": "Writing to resource", "resource": "Data updated by Writer 2 (rev 1)"}, {"time": 0.61, "type": "Reader", "id": 3, "action": "Waiting to read", "resource": "Data updated by Writer 2 (rev 1)"}, {"time": 0.72, "type": "Reader", "id": 1, "action": "Waiting to read", "resource": "Data updated by Writer 2 (rev 1)"}, {"time": 0.73, "type": "Reader", "id": 2, "action": "Waiting to read", "resource": "Data updated by Writer 2 (rev 1)"}, {"time": 0.83, "type": "Reader", "id": 4, "action": "Waiting to read", "resource": "Data updated by Writer 2 (rev 1)"}, {"time": 0.99, "type": "Writer", "id": 2, "action": "Finished writing", "resource": "Data updated by Writer 2 (rev 1)"}, {"time": 0.99, "type": "Writer", "id": 1, "action": "Writing to resource", "resource": "Data updated by Writer 1 (rev 1)"}, {"time": 1.28, "type": "Writer", "id": 1, "action": "Finished writing", "resource": "Data updated by Writer 1 (rev 1)"}, {"time": 1.28, "type": "Reader", "id": 3, "action": "Reading resource", "resource": "Data updated by Writer 1 (rev 1)"}, {"time": 1.28, "type": "Reader", "id": 1, "action": "Reading resource", "resource": "Data updated by Writer 1 (rev 1)"}, {"time": 1.28, "type": "Reader", "id": 2, "action": "Reading resource", "resource": "Data updated by Writer 1 (rev 1)"}, {"time": 1.28, "type": "Reader", "id": 4, "action": "Reading resource", "resource": "Data updated by Writer 1 (rev 1)"}, {"time": 1.32, "type": "Writer", "id": 2, "action": "Waiting to write", "resource": "Data updated by Writer 1 (rev 1)"}, {"time": 1.41, "type": "Reader", "id": 1, "action": "Finished reading", "resource": "Data updated by Writer 1 (rev 1)"}, {"time": 1.44, "type": "Reader", "id": 4, "action": "Finished reading", "resource": "Data updated by Writer 1 (rev 1)"}, {"time": 1.51, "type": "Reader", "id": 3, "action": "Finished reading", "resource": "Data updated by Writer 1 (rev 1)"}, {"time": 1.54, "type": "Reader", "id": 2, "action": "Finished reading", "resource": "Data updated by Writer 1 (rev 1)"}, {"time": 1.54, "type": "Writer", "id": 2, "action": "Writing to resource", "resource": "Data updated by Writer 2 (rev 2)"}, {"time": 1.63, "type": "Writer", "id": 1, "action": "Waiting to write", "resource": "Data updated by Writer 2 (rev 2)"}, {"time": 1.89, "type": "Writer", "id": 2, "action": "Finished writing", "resource": "Data updated by Writer 2 (rev 2)"}, {"time": 1.89, "type": "Writer", "id": 1, "action": "Writing to resource", "resource": "Data updated by Writer 1 (rev 2)"}, {"time": 2.18, "type": "Writer", "id": 1, "action": "Finished writing", "resource": "Data updated by Writer 1 (rev 2)"}];
        let currentIndex = 0;
        let timer = null;

        function renderRow(idx) {
            const row = events[idx];
            document.getElementById("resVal").innerText = row.resource;
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${row.time}</td><td>${row.type}</td><td>${row.id}</td><td>${row.action}</td><td>${row.resource}</td>`;
            document.getElementById("logBody").prepend(tr);
        }

        function step() {
            if (currentIndex < events.length) {
                renderRow(currentIndex);
                currentIndex++;
            } else {
                clearInterval(timer);
                timer = null;
            }
        }

        function play() {
            if (!timer) timer = setInterval(step, 400);
        }

        function pause() {
            clearInterval(timer);
            timer = null;
        }

        function reset() {
            pause();
            currentIndex = 0;
            document.getElementById("logBody").innerHTML = "";
            document.getElementById("resVal").innerText = "-";
        }
        play();
    </script>
</body>
</html>

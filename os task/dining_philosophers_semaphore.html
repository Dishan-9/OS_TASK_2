<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dining Philosophers (Semaphore) Simulation</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b132b; color: #fff; padding: 20px; }
        h1 { text-align: center; color: #48cae4; }
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        button { padding: 8px 16px; background: #48cae4; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: #0b132b; }
        .table-view { display: flex; justify-content: space-around; margin: 20px 0; }
        .phil-card { background: #1c2541; padding: 15px; border-radius: 8px; width: 180px; text-align: center; border: 2px solid #3a506b; }
        .state-THINKING { border-color: #6c757d; color: #ced4da; }
        .state-HUNGRY, .state-WAITING { border-color: #ffb703; color: #ffb703; }
        .state-EATING { border-color: #52b788; color: #52b788; font-weight: bold; }
        .fork-panel { background: #1c2541; border: 1px solid #3a506b; border-radius: 8px; padding: 10px; text-align: center; margin-bottom: 20px; }
        .fork-badge { display: inline-block; margin: 0 10px; padding: 5px 10px; border-radius: 4px; background: #3a506b; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #3a506b; padding: 8px; text-align: left; }
        th { background: #1c2541; }
    </style>
</head>
<body>
    <h1>Dining Philosophers (4 Philosophers - Semaphore)</h1>
    <div class="controls">
        <button onclick="play()">Play</button>
        <button onclick="pause()">Pause</button>
        <button onclick="reset()">Reset</button>
    </div>

    <div class="fork-panel">
        <strong>Forks Status:</strong>
        <span id="f0" class="fork-badge">Fork 0: Free</span>
        <span id="f1" class="fork-badge">Fork 1: Free</span>
        <span id="f2" class="fork-badge">Fork 2: Free</span>
        <span id="f3" class="fork-badge">Fork 3: Free</span>
    </div>

    <div class="table-view">
        <div id="p0" class="phil-card state-THINKING"><h3>P0</h3><div class="status">THINKING</div></div>
        <div id="p1" class="phil-card state-THINKING"><h3>P1</h3><div class="status">THINKING</div></div>
        <div id="p2" class="phil-card state-THINKING"><h3>P2</h3><div class="status">THINKING</div></div>
        <div id="p3" class="phil-card state-THINKING"><h3>P3</h3><div class="status">THINKING</div></div>
    </div>

    <table>
        <thead>
            <tr><th>Time (s)</th><th>Philosopher</th><th>State</th><th>Action Details</th></tr>
        </thead>
        <tbody id="logBody"></tbody>
    </table>

    <script>
        const events = [{"time": 0.0, "philosopher": 0, "state": "THINKING", "action": "Thinking...", "forks": [-1, -1, -1, -1]}, {"time": 0.0, "philosopher": 1, "state": "THINKING", "action": "Thinking...", "forks": [-1, -1, -1, -1]}, {"time": 0.0, "philosopher": 2, "state": "THINKING", "action": "Thinking...", "forks": [-1, -1, -1, -1]}, {"time": 0.0, "philosopher": 3, "state": "THINKING", "action": "Thinking...", "forks": [-1, -1, -1, -1]}, {"time": 0.16, "philosopher": 2, "state": "HUNGRY", "action": "Waiting for room admission", "forks": [-1, -1, -1, -1]}, {"time": 0.16, "philosopher": 2, "state": "WAITING", "action": "Acquired left fork 2", "forks": [-1, -1, 2, -1]}, {"time": 0.16, "philosopher": 2, "state": "EATING", "action": "Acquired right fork 3. Eating...", "forks": [-1, -1, 2, 2]}, {"time": 0.22, "philosopher": 0, "state": "HUNGRY", "action": "Waiting for room admission", "forks": [-1, -1, 2, 2]}, {"time": 0.22, "philosopher": 0, "state": "WAITING", "action": "Acquired left fork 0", "forks": [0, -1, 2, 2]}, {"time": 0.22, "philosopher": 0, "state": "EATING", "action": "Acquired right fork 1. Eating...", "forks": [0, 0, 2, 2]}, {"time": 0.23, "philosopher": 3, "state": "HUNGRY", "action": "Waiting for room admission", "forks": [0, 0, 2, 2]}, {"time": 0.28, "philosopher": 1, "state": "HUNGRY", "action": "Waiting for room admission", "forks": [0, 0, 2, 2]}, {"time": 0.5, "philosopher": 2, "state": "THINKING", "action": "Released forks 2 & 3", "forks": [0, 0, -1, -1]}, {"time": 0.5, "philosopher": 2, "state": "THINKING", "action": "Thinking...", "forks": [0, 0, -1, -1]}, {"time": 0.5, "philosopher": 3, "state": "WAITING", "action": "Acquired left fork 3", "forks": [0, 0, -1, 3]}, {"time": 0.56, "philosopher": 0, "state": "THINKING", "action": "Released forks 0 & 1", "forks": [-1, -1, -1, 3]}, {"time": 0.56, "philosopher": 0, "state": "THINKING", "action": "Thinking...", "forks": [-1, -1, -1, 3]}, {"time": 0.56, "philosopher": 1, "state": "WAITING", "action": "Acquired left fork 1", "forks": [-1, 1, -1, 3]}, {"time": 0.56, "philosopher": 1, "state": "EATING", "action": "Acquired right fork 2. Eating...", "forks": [-1, 1, 1, 3]}, {"time": 0.56, "philosopher": 3, "state": "EATING", "action": "Acquired right fork 0. Eating...", "forks": [3, 1, 1, 3]}, {"time": 0.64, "philosopher": 2, "state": "HUNGRY", "action": "Waiting for room admission", "forks": [3, 1, 1, 3]}, {"time": 0.78, "philosopher": 0, "state": "HUNGRY", "action": "Waiting for room admission", "forks": [3, 1, 1, 3]}, {"time": 0.84, "philosopher": 1, "state": "THINKING", "action": "Released forks 1 & 2", "forks": [3, -1, -1, 3]}, {"time": 0.84, "philosopher": 1, "state": "THINKING", "action": "Thinking...", "forks": [3, -1, -1, 3]}, {"time": 0.84, "philosopher": 2, "state": "WAITING", "action": "Acquired left fork 2", "forks": [3, -1, 2, 3]}, {"time": 0.86, "philosopher": 3, "state": "THINKING", "action": "Released forks 3 & 0", "forks": [-1, -1, 2, -1]}, {"time": 0.86, "philosopher": 3, "state": "THINKING", "action": "Thinking...", "forks": [-1, -1, 2, -1]}, {"time": 0.86, "philosopher": 0, "state": "WAITING", "action": "Acquired left fork 0", "forks": [0, -1, 2, -1]}, {"time": 0.86, "philosopher": 0, "state": "EATING", "action": "Acquired right fork 1. Eating...", "forks": [0, 0, 2, -1]}, {"time": 0.86, "philosopher": 2, "state": "EATING", "action": "Acquired right fork 3. Eating...", "forks": [0, 0, 2, 2]}, {"time": 0.99, "philosopher": 3, "state": "HUNGRY", "action": "Waiting for room admission", "forks": [0, 0, 2, 2]}, {"time": 1.08, "philosopher": 1, "state": "HUNGRY", "action": "Waiting for room admission", "forks": [0, 0, 2, 2]}, {"time": 1.13, "philosopher": 2, "state": "THINKING", "action": "Released forks 2 & 3", "forks": [0, 0, -1, -1]}, {"time": 1.13, "philosopher": 2, "state": "THINKING", "action": "Thinking...", "forks": [0, 0, -1, -1]}, {"time": 1.13, "philosopher": 3, "state": "WAITING", "action": "Acquired left fork 3", "forks": [0, 0, -1, 3]}, {"time": 1.23, "philosopher": 0, "state": "THINKING", "action": "Released forks 0 & 1", "forks": [-1, -1, -1, 3]}, {"time": 1.23, "philosopher": 0, "state": "THINKING", "action": "Thinking...", "forks": [-1, -1, -1, 3]}, {"time": 1.23, "philosopher": 1, "state": "WAITING", "action": "Acquired left fork 1", "forks": [-1, 1, -1, 3]}, {"time": 1.23, "philosopher": 1, "state": "EATING", "action": "Acquired right fork 2. Eating...", "forks": [-1, 1, 1, 3]}, {"time": 1.23, "philosopher": 3, "state": "EATING", "action": "Acquired right fork 0. Eating...", "forks": [3, 1, 1, 3]}, {"time": 1.36, "philosopher": 0, "state": "HUNGRY", "action": "Waiting for room admission", "forks": [3, 1, 1, 3]}, {"time": 1.37, "philosopher": 2, "state": "HUNGRY", "action": "Waiting for room admission", "forks": [3, 1, 1, 3]}, {"time": 1.53, "philosopher": 3, "state": "THINKING", "action": "Released forks 3 & 0", "forks": [-1, 1, 1, -1]}, {"time": 1.53, "philosopher": 3, "state": "THINKING", "action": "Thinking...", "forks": [-1, 1, 1, -1]}, {"time": 1.53, "philosopher": 0, "state": "WAITING", "action": "Acquired left fork 0", "forks": [0, 1, 1, -1]}, {"time": 1.54, "philosopher": 1, "state": "THINKING", "action": "Released forks 1 & 2", "forks": [0, -1, -1, -1]}, {"time": 1.54, "philosopher": 1, "state": "THINKING", "action": "Thinking...", "forks": [0, -1, -1, -1]}, {"time": 1.54, "philosopher": 2, "state": "WAITING", "action": "Acquired left fork 2", "forks": [0, -1, 2, -1]}, {"time": 1.54, "philosopher": 2, "state": "EATING", "action": "Acquired right fork 3. Eating...", "forks": [0, -1, 2, 2]}, {"time": 1.54, "philosopher": 0, "state": "EATING", "action": "Acquired right fork 1. Eating...", "forks": [0, 0, 2, 2]}, {"time": 1.65, "philosopher": 1, "state": "HUNGRY", "action": "Waiting for room admission", "forks": [0, 0, 2, 2]}, {"time": 1.66, "philosopher": 3, "state": "HUNGRY", "action": "Waiting for room admission", "forks": [0, 0, 2, 2]}, {"time": 1.78, "philosopher": 0, "state": "THINKING", "action": "Released forks 0 & 1", "forks": [-1, -1, 2, 2]}, {"time": 1.78, "philosopher": 1, "state": "WAITING", "action": "Acquired left fork 1", "forks": [-1, 1, 2, 2]}, {"time": 1.9, "philosopher": 2, "state": "THINKING", "action": "Released forks 2 & 3", "forks": [-1, 1, -1, -1]}, {"time": 1.9, "philosopher": 3, "state": "WAITING", "action": "Acquired left fork 3", "forks": [-1, 1, -1, 3]}, {"time": 1.9, "philosopher": 3, "state": "EATING", "action": "Acquired right fork 0. Eating...", "forks": [3, 1, -1, 3]}, {"time": 1.9, "philosopher": 1, "state": "EATING", "action": "Acquired right fork 2. Eating...", "forks": [3, 1, 1, 3]}, {"time": 2.29, "philosopher": 3, "state": "THINKING", "action": "Released forks 3 & 0", "forks": [-1, 1, 1, -1]}, {"time": 2.29, "philosopher": 1, "state": "THINKING", "action": "Released forks 1 & 2", "forks": [-1, -1, -1, -1]}];
        let currentIndex = 0;
        let timer = null;

        function updateUI(ev) {
            const card = document.getElementById("p" + ev.philosopher);
            card.className = "phil-card state-" + ev.state;
            card.querySelector(".status").innerText = ev.state;

            for (let f = 0; f < 4; f++) {
                const badge = document.getElementById("f" + f);
                const holder = ev.forks[f];
                if (holder === -1) {
                    badge.innerText = `Fork ${f}: Free`;
                    badge.style.background = "#3a506b";
                } else {
                    badge.innerText = `Fork ${f}: Held by P${holder}`;
                    badge.style.background = "#d90429";
                }
            }
        }

        function step() {
            if (currentIndex < events.length) {
                const ev = events[currentIndex];
                updateUI(ev);
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${ev.time}</td><td>P${ev.philosopher}</td><td>${ev.state}</td><td>${ev.action}</td>`;
                document.getElementById("logBody").prepend(tr);
                currentIndex++;
            } else {
                clearInterval(timer);
                timer = null;
            }
        }

        function play() {
            if (!timer) timer = setInterval(step, 350);
        }

        function pause() {
            clearInterval(timer);
            timer = null;
        }

        function reset() {
            pause();
            currentIndex = 0;
            document.getElementById("logBody").innerHTML = "";
            for (let i = 0; i < 4; i++) {
                const card = document.getElementById("p" + i);
                card.className = "phil-card state-THINKING";
                card.querySelector(".status").innerText = "THINKING";
                document.getElementById("f" + i).innerText = `Fork ${i}: Free`;
                document.getElementById("f" + i).style.background = "#3a506b";
            }
        }

        play();
    </script>
</body>
</html>
